name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Install Rust dependencies
        run: cargo build
        working-directory: app/rust

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter pub get (cargokit)
        run: dart pub get
        working-directory: app/rust_builder/cargokit/build_tool

      - name: Flutter analyze
        run: flutter analyze

  rust-test:
    name: Rust Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cargo test
        run: cargo test

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: [analyze, rust-test]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rch-windows
          path: app/build/windows/x64/runner/Release/
