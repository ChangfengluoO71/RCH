name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Install Rust dependencies
        run: cargo build
        working-directory: app/rust

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

  rust-test:
    name: Rust Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cargo test
        run: cargo test

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: [analyze, rust-test]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rch-windows
          path: app/build/windows/x64/runner/Release/

  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [analyze, rust-test]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: rch-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
