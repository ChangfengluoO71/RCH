name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 2026-09-21：Rust 工程在 app/rust（仓库根没有 Cargo.toml）。浮动的 @v1 action
          # 新版本会让 rust-cache 在**仓库根**探测 workspace 并调用 cargo ⇒
          # "could not find Cargo.toml（仓库根）D:\RCH\RCH" 直接让 Flutter Analyze job 失败。
          # 显式声明 workspace 路径后不再依赖它在根目录探测。
          cache-workspaces: app/rust

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Install Rust dependencies
        run: cargo build
        working-directory: app/rust

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter pub get (cargokit)
        run: dart pub get
        working-directory: app/rust_builder/cargokit/build_tool

      - name: Flutter analyze
        run: flutter analyze

  rust-test:
    name: Rust Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 2026-09-21：Rust 工程在 app/rust（仓库根没有 Cargo.toml）。浮动的 @v1 action
          # 新版本会让 rust-cache 在**仓库根**探测 workspace 并调用 cargo ⇒
          # "could not find Cargo.toml（仓库根）D:\RCH\RCH" 直接让 Flutter Analyze job 失败。
          # 显式声明 workspace 路径后不再依赖它在根目录探测。
          cache-workspaces: app/rust

      - name: Cargo test
        # 必须串行：`cache::set_custom_cache_root` 是**进程级全局**，并行 test 线程会互相
        # 覆盖缓存根，导致 cache/source/wake 用例随机失败（第 51/52 轮 A/B 已证）。
        # 与 `docs/reports/p0|p1/*` 记录的既有门禁一致。
        run: cargo test --locked -- --test-threads=1

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: [analyze, rust-test]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 2026-09-21：Rust 工程在 app/rust（仓库根没有 Cargo.toml）。浮动的 @v1 action
          # 新版本会让 rust-cache 在**仓库根**探测 workspace 并调用 cargo ⇒
          # "could not find Cargo.toml（仓库根）D:\RCH\RCH" 直接让 Flutter Analyze job 失败。
          # 显式声明 workspace 路径后不再依赖它在根目录探测。
          cache-workspaces: app/rust

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rch-windows
          path: app/build/windows/x64/runner/Release/

  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [analyze, rust-test]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 2026-09-21：Rust 工程在 app/rust（仓库根没有 Cargo.toml）。浮动的 @v1 action
          # 新版本会让 rust-cache 在**仓库根**探测 workspace 并调用 cargo ⇒
          # "could not find Cargo.toml（仓库根）D:\RCH\RCH" 直接让 Flutter Analyze job 失败。
          # 显式声明 workspace 路径后不再依赖它在根目录探测。
          cache-workspaces: app/rust
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter pub get (cargokit)
        run: dart pub get
        working-directory: app/rust_builder/cargokit/build_tool

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: rch-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
