name: Release

# 打 tag（v*）时自动构建 Windows 安装包并发布到 GitHub Release，
# 不再依赖本地打包环境。本地流程见 SETUP.md「发布」章节。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows Release
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $parts = $ver -split '\.'
          $code = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          flutter build windows --release --build-name="$ver" --build-number="$code"

      - name: Bundle PDFium runtime
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tgz = "$env:RUNNER_TEMP\pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile $tgz -UseBasicParsing
          tar -xzf $tgz -C "$env:RUNNER_TEMP"
          Copy-Item "$env:RUNNER_TEMP\bin\pdfium.dll" "build\windows\x64\runner\Release\pdfium.dll"
          Copy-Item "$env:RUNNER_TEMP\LICENSE" "build\windows\x64\runner\Release\pdfium-LICENSE.txt"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\setup.iss "/DMyAppVersion=`"$ver`""

      - name: Prepare release body
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          body="RCH ${tag} - see CHANGELOG.md for details"
          notes="${GITHUB_WORKSPACE}/release_notes_${tag}.md"
          if [ -f "$notes" ]; then body=$(cat "$notes"); fi
          printf '%s' "$body" > "$RUNNER_TEMP/release_body.md"

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RCH-*.exe
          body_path: ${{ runner.temp }}/release_body.md

  build-android:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter pub get (cargokit)
        run: dart pub get
        working-directory: app/rust_builder/cargokit/build_tool

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "release signing configured"
          else
            echo "::error::RELEASE_KEYSTORE_B64 未配置，发布包必须使用正式签名，请先在仓库 Secrets 中配置"
            exit 1
          fi

      - name: Build Android Release APK (split per ABI)
        shell: bash
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          IFS='.' read -r maj min pat <<< "$ver"
          code=$((maj * 10000 + min * 100 + pat))
          flutter build apk --release --split-per-abi --build-name="$ver" --build-number="$code"

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-*-release.apk
